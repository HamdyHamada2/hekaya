<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="c_title">اصنع هديتك | حكاية حب</title>
<link rel="stylesheet" href="/site.css">
<style id="hk-core-css">
.gx{position:relative;min-height:100%;display:grid;place-items:center;padding:24px;text-align:center;overflow:hidden;color:#ece4d3;background:radial-gradient(900px 520px at 50% 0%,var(--ga,#2a2113),var(--gb,#0e0c09));font:500 18px/1.8 Tajawal,Inter,system-ui,sans-serif}
.gx *{box-sizing:border-box}
.gx-in{position:relative;z-index:1;width:100%;max-width:460px}
.gx h2{margin:0 0 10px;font:700 30px/1.35 Amiri,"Playfair Display",Georgia,serif;color:var(--ac,#c9a45c)}
.gx p{margin:0 0 12px;color:#bdb39c}
.gx-ico{font-size:46px;margin-bottom:6px}
.gx-count{margin-top:10px;font:700 20px Inter,Tajawal,sans-serif;color:var(--ac,#c9a45c);direction:ltr;word-spacing:2px}
.gx-inp{display:block;width:100%;margin:12px 0 8px;padding:13px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.28);color:#ece4d3;font:inherit;text-align:center}
.gx-btn{display:inline-block;margin:6px;padding:11px 28px;border:0;border-radius:999px;cursor:pointer;font:700 16px Tajawal,Inter,sans-serif;color:#1a1408;background:linear-gradient(135deg,#e9d6a0,#c9a45c 55%,#a98a46)}
.gx-btn:disabled{opacity:.55}
.gx-sm{padding:7px 18px;font-size:14px}
.gx-err{min-height:1.7em;color:#ff9a90}
.gx-tip{margin-top:6px;color:var(--ac,#c9a45c);font-weight:700;animation:gxp 1.6s ease-in-out infinite}
@keyframes gxp{50%{opacity:.45}}
.gx button:focus-visible,.gx input:focus-visible{outline:3px solid #e9d6a0;outline-offset:3px}
.gx-box,.gx-env{display:block;margin:0 auto;border:0;background:none;padding:0;cursor:pointer;color:inherit}
.gx-box{width:min(78vw,300px);height:min(78vw,300px)}
.gx-box svg{width:100%;height:100%;overflow:visible}
.gx-box .gx-l,.gx-box .gx-bw,.gx-box .gx-c{transform-box:fill-box;transition:transform 1s cubic-bezier(.3,.8,.3,1)}
.gx-box .gx-l{transform-origin:0% 100%}
.gx-box .gx-bw{transform-origin:50% 100%}
.gx-box:not(.open){animation:gxb 2.4s ease-in-out infinite}
@keyframes gxb{50%{transform:translateY(-6px)}}
.gx-box.open .gx-l{transform:translate(-14px,-34px) rotate(-26deg)}
.gx-box.open .gx-bw{transform:translate(-30px,-46px) rotate(-26deg)}
.gx-c{transform:translateY(86px)}
.gx-box.open .gx-c{transform:translateY(-6px);transition-delay:.35s}
.gx-env{position:relative;width:min(80vw,290px);height:min(54vw,196px)}
.gx-eb,.gx-ef,.gx-ep,.gx-el{position:absolute}
.gx-eb{inset:0;background:#b8943f;border-radius:8px}
.gx-el{left:10%;right:10%;top:8%;height:80%;background:#ece4d3;border-radius:6px;padding:14% 12% 0;transition:transform 1s ease .35s;z-index:2}
.gx-el i{display:block;height:5px;margin-bottom:9px;border-radius:3px;background:#c9bb94}
.gx-ef{inset:0;z-index:3;border-radius:8px;background:linear-gradient(135deg,transparent 49.5%,#a98a46 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49.5%,#a98a46 50%) right/50% 100% no-repeat,linear-gradient(to top,#c9a45c 0,#c9a45c 100%) bottom/100% 55% no-repeat}
.gx-ep{left:0;right:0;top:0;height:58%;z-index:4;background:#d9c07f;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s ease,z-index 0s .3s;border-radius:8px 8px 0 0}
.gx-env:not(.open){animation:gxb 2.4s ease-in-out infinite}
.gx-env.open .gx-ep{transform:rotateX(180deg);z-index:1}
.gx-env.open .gx-el{transform:translateY(-62%)}
.gx-scr{position:relative;width:min(80vw,300px);aspect-ratio:3/2;margin:0 auto 10px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.14)}
.gx-under{position:absolute;inset:0;display:grid;place-content:center;background:rgba(0,0,0,.3)}
.gx-cv{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;transition:opacity .6s}
.gx-cv.gone{opacity:0;pointer-events:none}
.gx-card{animation:gxin .7s ease both}
@keyframes gxin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.gx-ph{display:block;max-width:100%;max-height:340px;margin:10px auto;border-radius:18px}
.gx-au{width:100%;margin:10px 0}
.gx-msg{white-space:pre-wrap;font-size:20px;line-height:1.9;margin:8px 0}
.gx-from{margin-top:10px;color:var(--ac,#c9a45c);font-weight:700}
.gx-mu{position:absolute;top:12px;inset-inline-start:12px;z-index:3;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:#e9d6a0;font-size:16px;cursor:pointer}
.gx-h{position:absolute;bottom:-30px;z-index:0;color:var(--ac,#c9a45c);opacity:.35;pointer-events:none;animation:gxu linear infinite}
@keyframes gxu{to{transform:translateY(-110vh)}}
@media(prefers-reduced-motion:reduce){.gx-tip,.gx-box:not(.open),.gx-env:not(.open),.gx-h{animation:none}.gx-card{animation:none}.gx-box .gx-l,.gx-box .gx-bw,.gx-box .gx-c,.gx-el,.gx-ep{transition:none}}
</style>
<style>
.cs-prog{display:flex;gap:6px;list-style:none;margin:0 0 22px;padding:0}
.cs-prog li{flex:1;display:grid;gap:4px;justify-items:center;text-align:center;font-size:13px;color:var(--mu)}
.cs-prog b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid #473d28;font:600 14px Inter,sans-serif}
.cs-prog li.on{color:var(--gold)}
.cs-prog li.on b,.cs-prog li.done b{background:linear-gradient(135deg,#e9d6a0,#c9a45c);color:#1a1408;border-color:transparent}
.cs-pane h2{font-size:22px;margin:22px 0 10px}
.cs-pane h2:first-child{margin-top:0}
.cs-chips{display:flex;flex-wrap:wrap;gap:8px}
.cs-chip{border:1px solid #473d28;background:var(--bg2);color:var(--tx);border-radius:999px;padding:8px 18px;font:500 15px Tajawal,Inter,sans-serif;cursor:pointer}
.cs-chip[aria-pressed=true]{border-color:var(--rose);color:var(--gold);background:rgba(201,164,92,.12)}
.cs-cards{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.cs-cards{grid-template-columns:repeat(4,1fr)}}
.cs-card{display:grid;gap:4px;justify-items:center;padding:16px 8px;border:1px solid var(--ln);border-radius:18px;background:var(--bg2);color:var(--tx);cursor:pointer;font:600 15px Tajawal,Inter,sans-serif}
.cs-card i{font-style:normal;font-size:30px}
.cs-card[aria-pressed=true]{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose) inset;color:var(--gold)}
.cs-sw{display:flex;gap:14px;flex-wrap:wrap}
.cs-s{display:grid;gap:6px;justify-items:center;background:none;border:0;color:var(--mu);cursor:pointer;font:500 13px Tajawal,Inter,sans-serif}
.cs-s span{width:44px;height:44px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px #473d28 inset}
.cs-s[aria-pressed=true] span{border-color:var(--gold)}
.cs-s[aria-pressed=true]{color:var(--gold)}
.cs-nav{display:flex;gap:10px;justify-content:space-between;margin-top:26px}
.cs-nav .sp{flex:1}
.cs-rec{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cs-res{margin-top:14px}
.cs-res a.l{display:block;word-break:break-all;direction:ltr;margin:6px 0}
#pv4.gx{min-height:480px;border-radius:24px;border:1px solid var(--ln)}
.cs-ov{position:fixed;inset:0;z-index:200;background:#0e0c09;overflow:auto}
.cs-ov .gx{min-height:100vh}
.cs-x{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:14px;z-index:201;width:44px;height:44px;border-radius:50%;border:1px solid #473d28;background:rgba(20,17,13,.8);color:var(--gold);font-size:24px;cursor:pointer}
</style>
</head>
<body data-i18n-page>
<div id="hdr"></div>
<main class="w">
<h1 data-i18n="c_title">اصنع هديتك</h1>
<ol class="cs-prog" id="prog" aria-label="Steps">
  <li class="on"><b>1</b><span data-i18n="c_s1">الفكرة</span></li>
  <li><b>2</b><span data-i18n="c_s2">المحتوى</span></li>
  <li><b>3</b><span data-i18n="c_s3">الحماية</span></li>
  <li><b>4</b><span data-i18n="c_s4">المعاينة</span></li>
</ol>

<section id="p1" class="cs-pane">
  <h2 data-i18n="c_occ">المناسبة</h2><div class="cs-chips" id="occ" role="group"></div>
  <h2 data-i18n="c_style">طريقة فتح الهدية</h2><div class="cs-cards" id="sty" role="group"></div>
  <h2 data-i18n="c_theme">اللون</h2><div class="cs-sw" id="thm" role="group"></div>
</section>

<section id="p2" class="cs-pane" hidden>
  <form onsubmit="return false">
    <label><span data-i18n="c_to">اسم المُهدى إليه</span><input id="f_to" maxlength="40" autocomplete="off"></label>
    <label><span data-i18n="c_from">اسمك</span><input id="f_from" maxlength="40" autocomplete="off"></label>
    <label><span data-i18n="c_msg">الرسالة</span><textarea id="f_msg" rows="5" maxlength="900"></textarea></label>
    <div><button class="btn o" id="sug" type="button" data-i18n="c_suggest">💡 اقترح عبارة</button></div>
    <label><span data-i18n="c_photo">صورة (اختياري)</span><input id="f_photo" type="file" accept="image/*"></label>
    <div class="cs-rec"><button class="btn o" id="rec" type="button" data-i18n="c_rec">🎙️ سجّل</button><span class="mu" id="recst"></span></div>
    <label><span data-i18n="c_music">موسيقى (حتى 10 ميجا)</span><input id="f_music" type="file" accept="audio/*"></label>
  </form>
</section>

<section id="p3" class="cs-pane" hidden>
  <form onsubmit="return false">
    <label><span data-i18n="c_pw">كلمة السر (اختياري، ومطلوبة للرابط)</span><input id="f_pw" type="password" autocomplete="new-password" maxlength="60"></label>
    <p class="mu" style="margin:0" data-i18n="c_pw_hint">كلمة سر طويلة أقوى. لو نسيتها مفيش استرجاع. من غير كلمة سر الهدية مش بتتشفّر.</p>
    <label><span data-i18n="c_unlock">تتفتح في (كبسولة زمن، اختياري)</span><input id="f_unlock" type="datetime-local"></label>
    <div><b data-i18n="c_glang">لغة الهدية</b>
      <div class="row" style="margin-top:6px"><label class="row"><input type="radio" name="gl" value="ar"> <span data-i18n="c_ar">العربية</span></label><label class="row"><input type="radio" name="gl" value="en"> <span>English</span></label></div></div>
  </form>
</section>

<section id="p4" class="cs-pane" hidden>
  <div id="pv4" class="gx"></div>
  <div class="row" style="margin-top:16px">
    <button class="btn" id="mklink" type="button" data-i18n="c_link">إنشاء رابط</button>
    <button class="btn o" id="mkfile" type="button" data-i18n="c_file">تنزيل كملف</button>
  </div>
  <div class="err" id="err4" role="status"></div>
  <div class="cs-res card" id="res" hidden></div>
</section>

<div class="err" id="err" role="status"></div>
<div class="cs-nav">
  <button class="btn o" id="back" type="button" data-i18n="c_back">رجوع</button>
  <span class="sp"></span>
  <button class="btn o" id="pvb" type="button" data-i18n="c_preview">معاينة</button>
  <button class="btn" id="next" type="button" data-i18n="c_next">التالي</button>
</div>
</main>
<div class="cs-ov" id="ov" hidden><button class="cs-x" id="ovx" type="button" aria-label="Close">×</button><div id="ovp"></div></div>

<script src="/shell.js"></script>
